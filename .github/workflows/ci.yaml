name: CI

on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    name: PHP ${{ matrix.php }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: exif, gd, bcmath, zip, pdo_sqlite

    - name: Require PHP 8.4.27 or newer
      run: |
        php -v
        php -r 'exit(version_compare(PHP_VERSION, "8.4.27", ">=") ? 0 : 1);'

    - name: Install PHP dependencies
      run: composer install --no-interaction --no-progress

    - name: Check coding style
      run: ./vendor/bin/php-cs-fixer fix -v --dry-run --using-cache=no --config=.php-cs-fixer.dist.php

    - name: Unit Tests
      run: php ./vendor/bin/pest
