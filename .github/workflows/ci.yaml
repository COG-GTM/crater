name: CI

on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    container: php:${{ matrix.php }}-cli
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4.27']

    name: PHP ${{ matrix.php }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        apt-get update
        apt-get install -y --no-install-recommends git unzip libzip-dev libpng-dev libonig-dev libxml2-dev
        docker-php-ext-install bcmath exif gd mbstring zip

    - name: Install Composer
      run: curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

    - name: Verify patched PHP runtime
      run: |
        php -v
        php -r 'exit(version_compare(PHP_VERSION, "8.4.27", ">=") ? 0 : 1);'

    - name: Install dependencies
      run: composer install --no-interaction --no-progress

    - name: Check coding style
      run: ./vendor/bin/php-cs-fixer fix -v --dry-run --using-cache=no --config=.php-cs-fixer.dist.php

    - name: Unit Tests
      run: php ./vendor/bin/pest
